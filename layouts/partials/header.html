<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css?family=Ubuntu+Mono&display=swap" rel="stylesheet">

        <title>{{.Title}}</title>
        <link rel="stylesheet" href="/css/stylesheet.css" />

        {{ if .Params.mathjax }} {{ partial "utilities/mathjax" . }} {{ end }}
    </head>
    <body>
        <nav class="site-nav">
            <a class="{{ if .IsHome }}active{{ end }}" href="/">Home</a>
            <a class="{{ if eq .RelPermalink "/post/"}}active{{ end }}" href="/post/">Posts</a>
            {{ with .Site.Params.github }}<a href="https://github.com/{{ . }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
            {{ with .Site.Params.gitlab }}<a href="https://gitlab.com/{{ . }}" target="_blank" rel="noopener">GitLab</a>{{ end }}
            <a class="{{ if eq .RelPermalink "/reading-list/"}}active{{ end }}" href="/reading-list/">Reading List</a>
            <a class="{{ if eq .RelPermalink "/about/"}}active{{ end }}" href="/about/">About</a>
        </nav>

        <section id="page-title">
            <h1><a href="/">{{ .Site.Title | default "Basics"}}</a></h1>
        </section>
