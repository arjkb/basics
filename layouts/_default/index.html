{{ define "content" }}
{{ .Content }}
<section>
  <ul class="posts_listing">
    {{ range where site.RegularPages "Section" "in" site.MainSections }}
    <li class="post-row">
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
      <a class="post-link" href="{{ .Permalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
